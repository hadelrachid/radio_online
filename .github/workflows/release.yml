name: Build and Release Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Package Plugin Archive
        run: |
          mkdir -p /tmp/pkg/radio_online
          cp -r . /tmp/pkg/radio_online/
          rm -rf /tmp/pkg/radio_online/.git /tmp/pkg/radio_online/.github /tmp/pkg/radio_online/dist
          mkdir -p dist
          (cd /tmp/pkg && zip -r "$GITHUB_WORKSPACE/dist/radio_online.zip" radio_online)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/radio_online.zip
          generate_release_notes: true